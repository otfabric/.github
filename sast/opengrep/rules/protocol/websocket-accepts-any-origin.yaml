rules:
  - id: otfabric-websocket-accepts-any-origin
    languages: [go]
    severity: ERROR
    message: >-
      This WebSocket upgrade accepts every Origin, so any web page a browser on
      the plant network opens can reach the endpoint. Compare the Origin with a
      configured list.
    metadata:
      category: security
      confidence: HIGH
      cwe: ["CWE-346: Origin Validation Error"]
      catalog: http
    pattern-either:
      - pattern: '$U.CheckOrigin = func($...A) bool { return true }'
      - pattern: 'websocket.Upgrader{..., CheckOrigin: func($...A) bool { return true }, ...}'
      - pattern: 'websocket.AcceptOptions{..., InsecureSkipVerify: true, ...}'
