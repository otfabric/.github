rules:
  - id: otfabric-tls-verify-result-ignored
    languages: [go]
    severity: ERROR
    message: >-
      The result of x509 chain verification is discarded on purpose, so an
      invalid certificate is accepted. Check the error. errcheck reports a call
      with no assignment; it does not report this form.
    metadata:
      category: security
      confidence: HIGH
      cwe: ["CWE-295: Improper Certificate Validation"]
      catalog: tls
    pattern-either:
      - pattern: '_, _ = $C.Verify(x509.VerifyOptions{...})'
      - pattern: '_ = $C.CheckSignatureFrom($P)'
