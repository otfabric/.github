rules:
  - id: otfabric-shell-pipe-to-interpreter
    languages: [bash]
    severity: WARNING
    message: >-
      Downloaded text runs directly, with nothing pinning what it is. Download
      a pinned version, check its SHA-256, then run it.
    metadata:
      category: security
      confidence: HIGH
      cwe: ["CWE-494: Download of Code Without Integrity Check"]
      catalog: command-injection
    pattern-either:
      - pattern: curl ... | bash
      - pattern: curl ... | sh
      - pattern: wget ... | bash
      - pattern: wget ... | sh
