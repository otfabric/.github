rules:
  - id: otfabric-shell-disables-tls-verification
    languages: [bash]
    severity: WARNING
    message: >-
      This script fetches without verifying the server certificate. Pin the
      certificate authority with --cacert instead.
    metadata:
      category: security
      confidence: HIGH
      cwe: ["CWE-295: Improper Certificate Validation"]
      catalog: tls
    pattern-either:
      - pattern: curl ... -k ...
      - pattern: curl ... --insecure ...
      - pattern: wget ... --no-check-certificate ...
