rules:
  - id: otfabric-gha-unsecure-commands
    languages: [yaml]
    severity: ERROR
    message: >-
      This turns the removed set-env and add-path workflow commands back on, so
      anything printed to the log can change the job's environment.
    metadata:
      category: security
      confidence: HIGH
      cwe: ["CWE-94: Improper Control of Generation of Code"]
      catalog: github-actions
    pattern-either:
      - pattern: 'ACTIONS_ALLOW_UNSECURE_COMMANDS: true'
      - pattern: 'ACTIONS_ALLOW_UNSECURE_COMMANDS: "true"'
