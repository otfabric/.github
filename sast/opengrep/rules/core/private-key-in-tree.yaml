rules:
  - id: otfabric-private-key-in-tree
    languages: [generic]
    severity: ERROR
    message: >-
      A private key is committed. Anyone who can read the repository can
      impersonate its owner, and rotating the key is the only remedy. Generate
      test keys at run time.
    metadata:
      category: security
      confidence: HIGH
      cwe: ["CWE-321: Use of Hard-coded Cryptographic Key"]
      catalog: secrets
    pattern-regex: '-----BEGIN (RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----\s*[A-Za-z0-9+/=]{20,}'
