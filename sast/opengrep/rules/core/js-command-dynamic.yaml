rules:
  - id: otfabric-js-command-dynamic
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A shell runs a command line that is not a constant, so its content becomes
      commands. Use execFile or spawn with an argument list.
    metadata:
      category: security
      confidence: HIGH
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]
      catalog: command-injection
    patterns:
      - pattern-either:
          - pattern: child_process.exec($CMD, ...)
          - pattern: child_process.execSync($CMD, ...)
          - pattern: |
              const {..., exec, ...} = require("child_process")
              ...
              exec($CMD, ...)
          - pattern: |
              import {..., exec, ...} from "child_process"
              ...
              exec($CMD, ...)
      - pattern-not: child_process.exec("...", ...)
      - pattern-not: child_process.execSync("...", ...)
