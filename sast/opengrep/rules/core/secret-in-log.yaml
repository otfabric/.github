rules:
  - id: otfabric-secret-in-log
    languages: [go]
    severity: ERROR
    message: >-
      A value named as a credential reaches a log call. Logs leave the trust
      boundary of the process: redact it (standards/security.md, "Secure
      defaults"). Static analysis sees the name, not the value, so a credential
      under another name is not found.
    metadata:
      category: security
      confidence: HIGH
      cwe: ["CWE-532: Insertion of Sensitive Information into Log File"]
      catalog: secrets
    patterns:
      - pattern-either:
          - pattern: 'slog.$F(..., $S, ...)'
          - pattern: '$L.$M($MSG, ..., $S, ...)'
          - pattern: 'log.$F(..., $S, ...)'
          - pattern: 'slog.$F(..., $O.$S, ...)'
          - pattern: '$L.$M($MSG, ..., $O.$S, ...)'
          - pattern: 'log.$F(..., $O.$S, ...)'
      - metavariable-regex:
          metavariable: $S
          regex: '(?i)^(password|passwd|passphrase|secret|clientsecret|privatekey|privkey|psk|presharedkey|apikey)$'
      - metavariable-regex:
          metavariable: $M
          regex: '^(Debug|Info|Warn|Error|Log|Print|Printf|Println|Fatal|Fatalf|Debugf|Infof|Warnf|Errorf|DebugContext|InfoContext|WarnContext|ErrorContext)$'
