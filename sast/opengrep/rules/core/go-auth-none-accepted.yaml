rules:
  - id: otfabric-go-auth-none-accepted
    languages: [go]
    severity: ERROR
    message: >-
      This accepts tokens signed with the "none" algorithm, which anyone can
      forge. Use a real signing method and check it when parsing.
    metadata:
      category: security
      confidence: HIGH
      cwe: ["CWE-347: Improper Verification of Cryptographic Signature"]
      catalog: auth
    pattern-either:
      - pattern: jwt.UnsafeAllowNoneSignatureType
      - pattern: jwt.SigningMethodNone
