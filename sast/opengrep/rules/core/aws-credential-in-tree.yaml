rules:
  - id: otfabric-aws-credential-in-tree
    languages: [generic]
    severity: ERROR
    message: >-
      An AWS credential is committed. Anyone who can read the repository can use
      it until it is deactivated, and removing it from the tree does not remove
      it from history. Deactivate it, then read it from a secret.
    metadata:
      category: security
      confidence: HIGH
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      catalog: secrets
    pattern-either:
      - pattern-regex: '\b(?:AKIA|ASIA)(?![A-Z0-9]*EXAMPLE)[A-Z0-9]{16}\b'
      - pattern-regex: '(?i)\baws_?secret(?:_?access)?_?key\b["'']?\s*[:=]\s*["'']?(?![A-Za-z0-9/+=]*EXAMPLE)[A-Za-z0-9/+=]{40}(?![A-Za-z0-9/+=])'
