rules:
  - id: otfabric-shell-world-writable
    languages: [bash]
    severity: ERROR
    message: >-
      This makes a path writable by every user. Any local account can then
      change certificates, configuration or binaries. Grant the owning group
      only.
    metadata:
      category: security
      confidence: HIGH
      cwe: ["CWE-732: Incorrect Permission Assignment for Critical Resource"]
      catalog: file-permissions
    pattern-either:
      - pattern: chmod ... 777 ...
      - pattern: chmod ... 666 ...
      - pattern: chmod ... a+w ...
      - pattern: chmod ... o+w ...
