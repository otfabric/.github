rules:
  - id: otfabric-go-secret-compare-not-constant-time
    languages: [go]
    severity: WARNING
    message: >-
      A credential is compared with ==, whose time depends on the content.
      Use crypto/subtle.ConstantTimeCompare (standards/security.md).
    metadata:
      category: security
      confidence: MEDIUM
      cwe: ["CWE-208: Observable Timing Discrepancy"]
      catalog: auth
      limitation: Goes by the name of the value, so another name is not found.
    patterns:
      - pattern-either:
          - pattern: $A == $S
          - pattern: $S == $A
          - pattern: $A != $S
          - pattern: $S != $A
          - pattern: $A == $O.$S
          - pattern: $O.$S == $A
          - pattern: $A != $O.$S
          - pattern: $O.$S != $A
      - metavariable-regex:
          metavariable: $S
          regex: '(?i)^(password|passwd|passphrase|secret|clientsecret|apikey|psk|presharedkey)$'
      - pattern-not: $S == ""
      - pattern-not: $S != ""
      - pattern-not: $O.$S == ""
      - pattern-not: $O.$S != ""
      - pattern-not: $S == nil
      - pattern-not: $S != nil
      - pattern-not: $O.$S == nil
      - pattern-not: $O.$S != nil
