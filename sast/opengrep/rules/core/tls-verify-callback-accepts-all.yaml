rules:
  - id: otfabric-tls-verify-callback-accepts-all
    languages: [go]
    severity: ERROR
    message: >-
      This TLS verification callback accepts every peer certificate. With
      InsecureSkipVerify it turns verification off completely, while gosec G402
      sees only the flag. Verify the chain, or remove the callback.
    metadata:
      category: security
      confidence: HIGH
      cwe: ["CWE-295: Improper Certificate Validation"]
      catalog: tls
    pattern-either:
      - pattern: 'tls.Config{..., VerifyPeerCertificate: func($...A) error { return nil }, ...}'
      - pattern: 'tls.Config{..., VerifyConnection: func($...A) error { return nil }, ...}'
      - pattern: '$C.VerifyPeerCertificate = func($...A) error { return nil }'
      - pattern: '$C.VerifyConnection = func($...A) error { return nil }'
