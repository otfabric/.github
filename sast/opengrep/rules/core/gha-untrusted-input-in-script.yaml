rules:
  - id: otfabric-gha-untrusted-input-in-script
    languages: [yaml]
    severity: ERROR
    message: >-
      Text an outsider controls is pasted into a script before it runs, so a
      pull request title can run commands with this job's token. Pass it
      through env and quote the variable.
    metadata:
      category: security
      confidence: HIGH
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]
      catalog: github-actions
    patterns:
      - pattern-either:
          - pattern: 'run: $S'
          - pattern: 'script: $S'
      - metavariable-regex:
          metavariable: $S
          regex: '(?s).*\$\{\{\s*github\.(head_ref|event\.(pull_request\.(title|body|head\.(ref|label))|issue\.(title|body)|comment\.body|review\.body|discussion\.(title|body)|pages|commits|head_commit\.(message|author)|workflow_run\.head_branch)).*'
