rules:
  - id: otfabric-gha-pull-request-target-checkout
    languages: [yaml]
    severity: ERROR
    message: >-
      pull_request_target runs with the repository's secrets and a write token,
      and this checks out the code of the pull request. Anything that code runs
      gets those. Use pull_request, or do not check out the head.
    metadata:
      category: security
      confidence: HIGH
      cwe: ["CWE-829: Inclusion of Functionality from Untrusted Control Sphere"]
      catalog: github-actions
    patterns:
      - pattern-either:
          - pattern-inside: |
              on: pull_request_target
              ...
          - pattern-inside: |
              on: [..., pull_request_target, ...]
              ...
          - pattern-inside: |
              on:
                ...
                pull_request_target: ...
                ...
              ...
      - pattern: 'ref: $R'
      - metavariable-regex:
          metavariable: $R
          regex: '.*github\.(head_ref|event\.pull_request\.head\.(sha|ref)|event\.number).*'
