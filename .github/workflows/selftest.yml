# Regression tests of the shared workflows (ADR-0008 in otfabric/engineering).
#
# The go-ci job calls the workflow by local path, so a pull request tests its
# own version. A job that calls a reusable workflow cannot continue on error,
# so failing cases run the exact step scripts, extracted from the workflows.
#
# The policy job checks the repository root, and this repository has a
# .otfabric/policy.yaml, so a job that leaves run-policy on needs the token.
name: Selftest
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "actions/**"
      - "scripts/selftest/**"
      - "testdata/**"
  push:
    branches: [main]
  workflow_dispatch:

# go-ci requests id-token: write; a caller must grant what it calls.
permissions:
  contents: read
  id-token: write

jobs:
  # Every optional gate on, on a module that passes them all, cmd/ tested.
  go-ci-all-gates:
    uses: ./.github/workflows/go-ci.yml
    with:
      module-dir: testdata/go-ci/pass
      go-versions: '["1.23","1.26"]'
      test-exclude-regex: "/example(s)?($|/)"
      run-codecov: false
      run-govulncheck: true
      coverage-min: "80"
      coverage-mode: atomic
      fuzz-time: 5s
      run-policy: true
      policy-version: v1.2.0
    secrets:
      OTFABRIC_READ_TOKEN: ${{ secrets.OTFABRIC_READ_TOKEN }}

  # The v3 defaults: govulncheck on, cmd/ tested, atomic coverage.
  go-ci-defaults:
    uses: ./.github/workflows/go-ci.yml
    with:
      module-dir: testdata/go-ci/lowcov
      go-versions: '["1.23"]'
      run-codecov: false
    secrets:
      OTFABRIC_READ_TOKEN: ${{ secrets.OTFABRIC_READ_TOKEN }}

  # The input turns the job off. Its own module-dir: go-ci's concurrency group
  # is per module-dir, so two calls on one fixture cancel each other.
  go-ci-no-policy:
    uses: ./.github/workflows/go-ci.yml
    with:
      module-dir: testdata/go-ci/policy
      go-versions: '["1.23"]'
      run-codecov: false
      run-govulncheck: false
      run-policy: false

  # docs-check.yml: a module whose documents agree with its code, enforced,
  # with the policy job on.
  docs-check-pass:
    uses: ./.github/workflows/docs-check.yml
    with:
      module-dir: testdata/docs-check/pass
      mode: enforce
      policy-version: v1.2.0
    secrets:
      OTFABRIC_READ_TOKEN: ${{ secrets.OTFABRIC_READ_TOKEN }}

  # A module with a finding passes in warn mode.
  docs-check-warn:
    uses: ./.github/workflows/docs-check.yml
    with:
      module-dir: testdata/docs-check/fail
      mode: warn
      run-policy: false

  matrix-floor:
    name: Matrix floor cases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Extract the step from go-ci.yml
        run: python3 scripts/selftest/extract-step.py .github/workflows/go-ci.yml "Drop versions below the go directive" > "$RUNNER_TEMP/floor.sh"
      - name: Versions below go.mod are dropped
        run: |
          mkdir -p "$RUNNER_TEMP/m" && cd "$RUNNER_TEMP/m"
          printf 'module m\n\ngo 1.25.0\n' > go.mod
          MATRIX='["1.23","1.24","1.25","1.26"]' GITHUB_OUTPUT=out bash "$RUNNER_TEMP/floor.sh"
          grep -qx 'versions=\["1.25","1.26"\]' out
      - name: A floor above every version uses the floor
        run: |
          mkdir -p "$RUNNER_TEMP/h" && cd "$RUNNER_TEMP/h"
          printf 'module m\n\ngo 1.27.3\n' > go.mod
          MATRIX='["1.23","1.26"]' GITHUB_OUTPUT=out bash "$RUNNER_TEMP/floor.sh"
          grep -qx 'versions=\["1.27"\]' out

  coverage-gate:
    name: Coverage gate cases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: testdata/go-ci/lowcov/go.mod
          cache: false
      - name: Extract the gate from go-ci.yml
        run: python3 scripts/selftest/extract-step.py .github/workflows/go-ci.yml "Coverage gate" > "$RUNNER_TEMP/gate.sh"
      - name: Below the minimum fails
        working-directory: testdata/go-ci/lowcov
        run: |
          go test -coverprofile=coverage.out ./...
          if MIN=90 bash "$RUNNER_TEMP/gate.sh"; then echo "::error::gate passed below the minimum"; exit 1; fi
      - name: At the minimum passes
        working-directory: testdata/go-ci/lowcov
        run: MIN=10 bash "$RUNNER_TEMP/gate.sh"

  policy-gate:
    name: Policy job cases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/selftest/policy.sh

  docs-check-modes:
    name: Docs check cases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: scripts/selftest/docs-check.sh

  release-notes:
    name: Release notes extraction
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/selftest/release-notes.sh

  go-version:
    name: Release Go version resolution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/selftest/go-version.sh

  # pr-changes.yml: the classifier step on synthetic pull requests.
  pr-changes-cases:
    name: PR changes cases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/selftest/pr-changes.sh

  # actions/required-gate: every outcome of a mandatory job, every combination.
  required-gate-cases:
    name: Required gate cases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/selftest/required-gate.sh

  # The classifier on this run. A pull request here changes the paths above,
  # none of them documentation, and a push or dispatch is no pull request: full.
  pr-changes-live:
    uses: ./.github/workflows/pr-changes.yml

  # The gate on results GitHub produced: a documentation-only classification,
  # a heavy job its condition skipped, and a light job that succeeded.
  gate-fixture-docs-only:
    name: Gate fixture (documentation only)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      full: ${{ steps.classify.outputs.full }}
    steps:
      - id: classify
        run: echo "full=false" >> "$GITHUB_OUTPUT"

  gate-fixture-light:
    name: Gate fixture (light check)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "the light check ran"

  gate-fixture-heavy:
    name: Gate fixture (heavy check, skipped)
    needs: gate-fixture-docs-only
    if: needs.gate-fixture-docs-only.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: exit 1

  gate-fixture-heavy-code:
    name: Gate fixture (heavy check, code)
    needs: pr-changes-live
    if: needs.pr-changes-live.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "the heavy check ran"

  gate-live-docs:
    name: Required gate on a documentation-only run
    needs: [gate-fixture-docs-only, gate-fixture-light, gate-fixture-heavy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: The skipped heavy job is not applicable, so the gate passes
        uses: ./actions/required-gate
        with:
          needs: ${{ toJSON(needs) }}
          changes-job: gate-fixture-docs-only
          required: gate-fixture-docs-only gate-fixture-light
          required-for-code: gate-fixture-heavy
      - name: The same skip of a job required on every run fails
        id: unexpected-skip
        continue-on-error: true
        uses: ./actions/required-gate
        with:
          needs: ${{ toJSON(needs) }}
          changes-job: gate-fixture-docs-only
          required: gate-fixture-docs-only gate-fixture-light gate-fixture-heavy
      - name: A job with no expectation fails
        id: undeclared
        continue-on-error: true
        uses: ./actions/required-gate
        with:
          needs: ${{ toJSON(needs) }}
          changes-job: gate-fixture-docs-only
          required: gate-fixture-docs-only
          required-for-code: gate-fixture-heavy
      - name: Both failed
        env:
          SKIP: ${{ steps.unexpected-skip.outcome }}
          UNDECLARED: ${{ steps.undeclared.outcome }}
        run: |
          [ "$SKIP" = failure ] || { echo "::error::unexpected skip: $SKIP, want failure"; exit 1; }
          [ "$UNDECLARED" = failure ] || { echo "::error::undeclared job: $UNDECLARED, want failure"; exit 1; }

  gate-live-code:
    name: Required gate on a full run
    needs: [pr-changes-live, gate-fixture-light, gate-fixture-heavy-code]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: The live classification is full
        env:
          FULL: ${{ needs.pr-changes-live.outputs.full }}
          REASON: ${{ needs.pr-changes-live.outputs.reason }}
        run: |
          echo "full=$FULL reason=$REASON"
          [ "$FULL" = true ] && [ -n "$REASON" ]
      - name: Every job succeeded, so the gate passes
        uses: ./actions/required-gate
        with:
          needs: ${{ toJSON(needs) }}
          changes-job: pr-changes-live
          required: pr-changes-live gate-fixture-light
          required-for-code: gate-fixture-heavy-code
