# Regression tests of the shared workflows (ADR-0008 in otfabric/engineering).
#
# The go-ci job calls the workflow by local path, so a pull request tests its
# own version. A job that calls a reusable workflow cannot continue on error,
# so failing cases run the exact step scripts, extracted from the workflows.
#
# The policy job checks the repository root, and this repository has a
# .otfabric/policy.yaml, so a job that leaves run-policy on needs the token.
name: Selftest
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "actions/**"
      - "sast/**"
      - "scripts/selftest/**"
      - "testdata/**"
  push:
    branches: [main]
  workflow_dispatch:

# go-ci requests id-token: write; a caller must grant what it calls.
permissions:
  contents: read
  id-token: write

jobs:
  # Every optional gate on, on a module that passes them all, cmd/ tested.
  go-ci-all-gates:
    uses: ./.github/workflows/go-ci.yml
    with:
      module-dir: testdata/go-ci/pass
      go-versions: '["1.23","1.26"]'
      test-exclude-regex: "/example(s)?($|/)"
      run-codecov: false
      run-govulncheck: true
      coverage-min: "80"
      coverage-mode: atomic
      fuzz-time: 5s
      run-policy: true
      policy-version: v1.2.0
      # A go-ci call with SAST on, in report mode, on this repository's root.
      run-sast: true
      sast-bundle-ref: ${{ github.sha }}
      sast-artifact-name: sast-go-ci
    secrets:
      OTFABRIC_READ_TOKEN: ${{ secrets.OTFABRIC_READ_TOKEN }}

  # The v3 defaults: govulncheck on, cmd/ tested, atomic coverage.
  go-ci-defaults:
    uses: ./.github/workflows/go-ci.yml
    with:
      module-dir: testdata/go-ci/lowcov
      go-versions: '["1.23"]'
      run-codecov: false
    secrets:
      OTFABRIC_READ_TOKEN: ${{ secrets.OTFABRIC_READ_TOKEN }}

  # The input turns the job off. Its own module-dir: go-ci's concurrency group
  # is per module-dir, so two calls on one fixture cancel each other.
  go-ci-no-policy:
    uses: ./.github/workflows/go-ci.yml
    with:
      module-dir: testdata/go-ci/policy
      go-versions: '["1.23"]'
      run-codecov: false
      run-govulncheck: false
      run-policy: false

  matrix-floor:
    name: Matrix floor cases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Extract the step from go-ci.yml
        run: python3 scripts/selftest/extract-step.py .github/workflows/go-ci.yml "Drop versions below the go directive" > "$RUNNER_TEMP/floor.sh"
      - name: Versions below go.mod are dropped
        run: |
          mkdir -p "$RUNNER_TEMP/m" && cd "$RUNNER_TEMP/m"
          printf 'module m\n\ngo 1.25.0\n' > go.mod
          MATRIX='["1.23","1.24","1.25","1.26"]' GITHUB_OUTPUT=out bash "$RUNNER_TEMP/floor.sh"
          grep -qx 'versions=\["1.25","1.26"\]' out
      - name: A floor above every version uses the floor
        run: |
          mkdir -p "$RUNNER_TEMP/h" && cd "$RUNNER_TEMP/h"
          printf 'module m\n\ngo 1.27.3\n' > go.mod
          MATRIX='["1.23","1.26"]' GITHUB_OUTPUT=out bash "$RUNNER_TEMP/floor.sh"
          grep -qx 'versions=\["1.27"\]' out

  coverage-gate:
    name: Coverage gate cases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: testdata/go-ci/lowcov/go.mod
          cache: false
      - name: Extract the gate from go-ci.yml
        run: python3 scripts/selftest/extract-step.py .github/workflows/go-ci.yml "Coverage gate" > "$RUNNER_TEMP/gate.sh"
      - name: Below the minimum fails
        working-directory: testdata/go-ci/lowcov
        run: |
          go test -coverprofile=coverage.out ./...
          if MIN=90 bash "$RUNNER_TEMP/gate.sh"; then echo "::error::gate passed below the minimum"; exit 1; fi
      - name: At the minimum passes
        working-directory: testdata/go-ci/lowcov
        run: MIN=10 bash "$RUNNER_TEMP/gate.sh"

  policy-gate:
    name: Policy job cases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/selftest/policy.sh

  release-notes:
    name: Release notes extraction
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/selftest/release-notes.sh

  # What the gate does with reports, with no scanner involved: every status
  # and exit code, and hostile file names.
  sast-gate:
    name: SAST gate cases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/selftest/sast.sh

  # The pinned scanners on the fixtures, through the scripts the workflow runs.
  sast-e2e:
    name: SAST scanner cases
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install the pinned scanners
        run: |
          bash sast/install.sh gosec "$RUNNER_TEMP/tools"
          bash sast/install.sh opengrep "$RUNNER_TEMP/tools"
      - name: Every rule against its fixtures
        run: scripts/selftest/sast-rules.sh "$RUNNER_TEMP/tools/opengrep"
      - name: Detection, baseline, enforcement and scanner failures
        run: scripts/selftest/sast-e2e.sh "$RUNNER_TEMP/tools/gosec" "$RUNNER_TEMP/tools/opengrep"
      - name: Failed installs fail, and the workflow keeps secrets and write access away
        run: |
          scripts/selftest/sast-install.sh
          scripts/selftest/sast-static.sh

  # The whole reusable workflow, findings reported and the job green.
  sast-workflow:
    uses: ./.github/workflows/sast.yml
    with:
      module-dir: testdata/sast/vulnerable-go
      # The fixtures are what this call is for.
      opengrep-exclude: "vendor"
      bundle-ref: ${{ github.sha }}
      artifact-name: sast-fixtures
      retention-days: 1

  sast-workflow-report:
    name: SAST workflow report
    needs: sast-workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: sast-fixtures
          path: reports
      - name: The artifact shows a completed scan and the planted findings
        env:
          SCAN_STATUS: ${{ needs.sast-workflow.outputs.scan-status }}
          FINDING_STATUS: ${{ needs.sast-workflow.outputs.finding-status }}
        run: scripts/selftest/sast-report.sh reports

  # This repository's own pilot: no Go module, so Opengrep only, and blocking.
  sast-self:
    uses: ./.github/workflows/sast.yml
    with:
      mode: baseline
      run-gosec: false
      opengrep-exclude: "testdata,sast/opengrep/rules"
      bundle-ref: ${{ github.sha }}
      artifact-name: sast-self
      retention-days: 7
