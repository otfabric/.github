# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Go CI — Reusable Workflow
#
# Lint, static analysis, coverage, and multi-version test matrix for Go
# projects. Designed for use across the otfabric GitHub organisation.
#
# Jobs:
#   lint-and-coverage  — golangci-lint, go vet, and tests with coverage using
#                        the Go version from go.mod (floor: 1.23).
#   test-matrix        — Tests and, in a parallel job, the race detector on each version in go-versions.
#   govulncheck        — Optional (run-govulncheck), on the current stable Go.
#   fuzz-smoke         — Optional (fuzz-time), every discovered Fuzz target.
#   policy             — Optional (run-policy), otfabric-policy on repositories
#                        with .otfabric/policy.yaml, on the current stable Go.
#
# Caller example:
#
#   jobs:
#     ci:
#       uses: otfabric/.github/.github/workflows/go-ci.yml@v2
#       with:
#         go-versions: '["1.24","1.25","1.26"]'
#         codecov-name: my-project
#         # Optional: attribute coverage across packages (matches local
#         # `go test -coverpkg=...` / make coverage gates).
#         coverpkg: github.com/otfabric/my-lib,github.com/otfabric/my-lib/pkg
#       secrets:
#         OTFABRIC_READ_TOKEN: ${{ secrets.OTFABRIC_READ_TOKEN }}

name: Go CI

on:
  workflow_call:
    inputs:
      go-versions:
        description: >-
          JSON array of Go versions for the test matrix. Versions below the
          go directive of go.mod are dropped, so the matrix starts at the
          floor the module declares. The lint/coverage job always uses the
          version from go.mod (minimum 1.23 for golangci-lint v2 compatibility).
        required: false
        type: string
        default: '["1.23","1.24","1.25","1.26"]'
      codecov-name:
        description: >-
          Codecov flag / upload name. Leave empty to skip the Codecov upload
          even when run-codecov is true.
        required: false
        type: string
        default: ""
      test-exclude-regex:
        description: >-
          Extended regex passed to grep -Ev to exclude packages from testing.
          Matched against the output of go list ./... .
        required: false
        type: string
        default: "/example(s)?($|/)"
      coverpkg:
        description: >-
          Optional comma-separated package list passed to go test -coverpkg
          during the lint-and-coverage job. When set, coverage is attributed
          across those packages (including hits from tests in other packages
          such as conformance suites). Leave empty for default per-package
          coverage of the tested packages only.
        required: false
        type: string
        default: ""
      timeout-minutes:
        description: "Job-level timeout in minutes (applies to every job)."
        required: false
        type: number
        default: 15
      run-codecov:
        description: "Upload coverage to Codecov (also requires a non-empty codecov-name)."
        required: false
        type: boolean
        default: true
      golangci-lint-version:
        description: "golangci-lint version to install (e.g. v2.1.6)."
        required: false
        type: string
        default: "v2.1.6"
      module-dir:
        description: "Directory of the Go module, relative to the repository root."
        required: false
        type: string
        default: "."
      run-govulncheck:
        description: "Run govulncheck in its own job, on the current stable Go."
        required: false
        type: boolean
        default: true
      govulncheck-version:
        description: "govulncheck version (v1.9.0 needs Go >= 1.26, which the stable job provides)."
        required: false
        type: string
        default: "v1.9.0"
      coverage-min:
        description: >-
          Minimum total statement coverage in percent, e.g. "90". The job fails
          below it. Leave empty for no gate.
        required: false
        type: string
        default: ""
      coverage-mode:
        description: "go test -covermode for the coverage run: set, count or atomic."
        required: false
        type: string
        default: "atomic"
      fuzz-time:
        description: >-
          Run every Fuzz target for this long, e.g. "10s", in a separate job.
          Targets are discovered, never listed. Leave empty for no fuzzing.
        required: false
        type: string
        default: ""
      run-policy:
        description: >-
          Run otfabric-policy on the repository root, in its own job, when
          .otfabric/policy.yaml exists. Needs OTFABRIC_READ_TOKEN.
        required: false
        type: boolean
        default: true
      policy-version:
        description: "Tag of otfabric/engineering whose otfabric-policy to run."
        required: false
        type: string
        default: "v1.1.0"
    secrets:
      OTFABRIC_READ_TOKEN:
        description: >-
          PAT with read access to private github.com/otfabric/* modules.
          Needed by modules with private dependencies, and by the policy job
          in repositories with .otfabric/policy.yaml. Optional here because
          pull requests from forks never have it; the policy job fails when a
          same-repository run lacks it.
        required: false

permissions:
  contents: read
  id-token: write # Codecov OIDC token exchange

env:
  GOPRIVATE: github.com/otfabric/*

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.module-dir }}
  cancel-in-progress: true

jobs:
  lint-and-coverage:
    name: Lint & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.module-dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Go version for linting
        id: goversion
        shell: bash
        run: |
          set -euo pipefail

          mod_go=$(
            sed -nE 's/^go ([0-9]+\.[0-9]+)(\.[0-9]+)?$/\1/p' go.mod | head -n1
          )

          if [ -z "$mod_go" ]; then
            echo "::error::Could not determine Go version from go.mod"
            exit 1
          fi

          # golangci-lint v2 requires Go >= 1.23
          min_lint_go="1.23"
          lowest="$(printf '%s\n%s\n' "$mod_go" "$min_lint_go" | sort -V | head -n1)"
          if [ "$lowest" = "$mod_go" ]; then
            lint_go="$min_lint_go"
          else
            lint_go="$mod_go"
          fi

          echo "go_mod=$mod_go"   >> "$GITHUB_OUTPUT"
          echo "lint_go=$lint_go" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.goversion.outputs.lint_go }}
          cache: true
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Configure private module access
        shell: bash
        env:
          TOKEN: ${{ secrets.OTFABRIC_READ_TOKEN }}
        run: |
          if [ -n "${TOKEN}" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/otfabric/".insteadOf "https://github.com/otfabric/"
          fi

      - name: Verify module tidiness
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code

      - name: Download dependencies
        shell: bash
        run: go mod download

      - name: Verify dependencies
        shell: bash
        run: go mod verify

      - name: go vet
        shell: bash
        run: go vet ./...

      - name: golangci-lint
        shell: bash
        env:
          LINT_VERSION: ${{ inputs.golangci-lint-version }}
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${LINT_VERSION}"
          golangci-lint run --timeout=5m

      - name: Resolve test packages
        id: pkgs
        shell: bash
        env:
          EXCLUDE_REGEX: ${{ inputs.test-exclude-regex }}
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(go list ./... | grep -Ev "${EXCLUDE_REGEX}" || true)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "::error::No test packages found after exclusion filter"
            exit 1
          fi
          printf 'list=%s\n' "${pkgs[*]}" >> "$GITHUB_OUTPUT"

      - name: Run tests with coverage
        shell: bash
        env:
          COVERPKG: ${{ inputs.coverpkg }}
          COVERMODE: ${{ inputs.coverage-mode }}
        run: |
          set -euo pipefail
          cover_args=()
          if [ -n "${COVERPKG}" ]; then
            cover_args+=(-coverpkg="${COVERPKG}")
            echo "Using -coverpkg=${COVERPKG}"
          fi
          # shellcheck disable=SC2086 # intentional: package list is space-separated
          go test -count=1 -timeout=120s \
            -coverprofile=coverage.out -covermode="${COVERMODE}" \
            "${cover_args[@]}" \
            ${{ steps.pkgs.outputs.list }}
          go tool cover -func=coverage.out | tee coverage.txt
          go tool cover -html=coverage.out -o coverage.html

      - name: Coverage gate
        if: inputs.coverage-min != ''
        shell: bash
        env:
          MIN: ${{ inputs.coverage-min }}
        run: |
          set -euo pipefail
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')
          awk -v t="$total" -v m="$MIN" 'BEGIN {
            if (t+0 < m+0) { printf "::error::coverage %.1f%% is below the minimum %s%%\n", t, m; exit 1 }
            printf "coverage %.1f%% >= %s%%\n", t, m
          }'

      - name: Coverage summary
        shell: bash
        run: |
          {
            echo "## Coverage Report"
            echo
            echo '```text'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-go-mod-version
          path: |
            ${{ inputs.module-dir }}/coverage.out
            ${{ inputs.module-dir }}/coverage.txt
            ${{ inputs.module-dir }}/coverage.html

      - name: Upload to Codecov
        if: inputs.run-codecov && inputs.codecov-name != ''
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ${{ inputs.module-dir }}/coverage.out
          flags: unittests
          name: ${{ inputs.codecov-name }}
          fail_ci_if_error: false
          verbose: true

  # ---------------------------------------------------------------------------
  # Test matrix — validates compilation and test-suite on each Go version.
  # Lint, vet, and module verification run once in lint-and-coverage; this job
  # focuses purely on build + test correctness across versions.
  # ---------------------------------------------------------------------------
  # The plain and the race-detector runs are separate jobs so they run in
  # parallel (the race run takes about twice as long).
  matrix-versions:
    name: Resolve Go versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Drop versions below the go directive
        id: resolve
        shell: bash
        working-directory: ${{ inputs.module-dir }}
        env:
          MATRIX: ${{ inputs.go-versions }}
        run: |
          set -euo pipefail
          floor=$(sed -nE 's/^go ([0-9]+\.[0-9]+)(\.[0-9]+)?$/\1/p' go.mod | head -n1)
          versions=$(jq -c --arg floor "$floor" '
            def v: split(".") | map(tonumber);
            map(select((v) >= ($floor | v)))
          ' <<<"$MATRIX")
          if [ "$versions" = "[]" ]; then
            versions=$(jq -cn --arg floor "$floor" '[$floor]')
          fi
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  test-matrix:
    name: ${{ matrix.race && 'Race' || 'Test' }} (Go ${{ matrix.go-version }})
    needs: matrix-versions
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.module-dir }}
    strategy:
      fail-fast: false
      matrix:
        go-version: ${{ fromJSON(needs.matrix-versions.outputs.versions) }}
        race: [false, true]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Configure private module access
        shell: bash
        env:
          TOKEN: ${{ secrets.OTFABRIC_READ_TOKEN }}
        run: |
          if [ -n "${TOKEN}" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/otfabric/".insteadOf "https://github.com/otfabric/"
          fi

      - name: Download dependencies
        shell: bash
        run: go mod download

      - name: Resolve test packages
        id: pkgs
        shell: bash
        env:
          EXCLUDE_REGEX: ${{ inputs.test-exclude-regex }}
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(go list ./... | grep -Ev "${EXCLUDE_REGEX}" || true)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "::error::No test packages found after exclusion filter"
            exit 1
          fi
          printf 'list=%s\n' "${pkgs[*]}" >> "$GITHUB_OUTPUT"

      - name: Test
        if: ${{ !matrix.race }}
        shell: bash
        run: go test -count=1 -timeout=120s ${{ steps.pkgs.outputs.list }}

      - name: Race test
        if: ${{ matrix.race }}
        shell: bash
        run: go test -count=1 -timeout=120s -race ${{ steps.pkgs.outputs.list }}

  # ---------------------------------------------------------------------------
  # Optional gates. Off by default so that existing callers keep their
  # behaviour; each runs apart from the matrix.
  # ---------------------------------------------------------------------------
  govulncheck:
    name: govulncheck
    if: inputs.run-govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.module-dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reports standard library findings for the toolchain it runs with.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Configure private module access
        shell: bash
        env:
          TOKEN: ${{ secrets.OTFABRIC_READ_TOKEN }}
        run: |
          if [ -n "${TOKEN}" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/otfabric/".insteadOf "https://github.com/otfabric/"
          fi

      - name: govulncheck
        shell: bash
        env:
          VERSION: ${{ inputs.govulncheck-version }}
        run: go run "golang.org/x/vuln/cmd/govulncheck@${VERSION}" ./...

  fuzz-smoke:
    name: Fuzz smoke
    if: inputs.fuzz-time != ''
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.module-dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Go 1.26 has a fuzz coordinator race at the end of -fuzztime
      # (go.dev/issue/75804), fixed in 1.27: fuzz on the current stable Go.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Configure private module access
        shell: bash
        env:
          TOKEN: ${{ secrets.OTFABRIC_READ_TOKEN }}
        run: |
          if [ -n "${TOKEN}" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/otfabric/".insteadOf "https://github.com/otfabric/"
          fi

      - name: Fuzz every target
        shell: bash
        env:
          FUZZTIME: ${{ inputs.fuzz-time }}
        run: |
          set -euo pipefail
          for pkg in $(go list ./...); do
            for target in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true); do
              echo "::group::$pkg $target"
              go test -run '^$' -fuzz "^${target}\$" -fuzztime "$FUZZTIME" "$pkg"
              echo "::endgroup::"
            done
          done

      - name: Keep failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/"
          if-no-files-found: ignore

  # The check is about the repository, so it runs at the root, not module-dir.
  # A secret cannot be read in a job-level if, and neither can a file, so a
  # step decides. It runs nothing from the checkout.
  policy:
    name: Policy
    if: inputs.run-policy
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Forks and Dependabot never get the secret, so they skip. A same-repo
      # run without it is a misconfigured caller: skipping would turn the gate
      # off unnoticed.
      - name: Decide whether the policy check runs
        id: gate
        shell: bash
        env:
          TOKEN: ${{ secrets.OTFABRIC_READ_TOKEN }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          run=false
          if [ ! -f .otfabric/policy.yaml ]; then
            echo "::notice::otfabric-policy skipped: no .otfabric/policy.yaml"
          elif [ "$EVENT" = pull_request ] && [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::notice::otfabric-policy skipped: pull request from a fork has no secrets"
          elif [ -n "$TOKEN" ]; then
            run=true
          elif [ "$ACTOR" = 'dependabot[bot]' ]; then
            echo "::notice::otfabric-policy skipped: Dependabot runs have no Actions secrets"
          else
            echo "::error::OTFABRIC_READ_TOKEN is empty, so otfabric-policy cannot be fetched. Pass it with 'secrets: inherit', or set run-policy: false."
            exit 1
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      # The checker has its own go.mod, unrelated to the caller's floor.
      - name: Set up Go
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Configure private module access
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          TOKEN: ${{ secrets.OTFABRIC_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/otfabric/engineering".insteadOf "https://github.com/otfabric/engineering"

      # Exit codes do not depend on the format, so one run gives the log, the
      # summary and the verdict. Whether findings block is up to the mode in
      # .otfabric/policy.yaml.
      - name: otfabric-policy
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GOWORK: "off"
          GOPRIVATE: github.com/otfabric/engineering
          VERSION: ${{ inputs.policy-version }}
        run: |
          set -euo pipefail
          go run "github.com/otfabric/engineering/cmd/otfabric-policy@${VERSION}" check -format markdown . | tee -a "$GITHUB_STEP_SUMMARY"
