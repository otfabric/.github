# Planted: a privileged workflow checks out the code that triggered it.
name: after-ci
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
